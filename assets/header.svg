<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="320" viewBox="0 0 1180 320" fill="none" role="img" aria-label="Rasya - Network and Web">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1180" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="0.55" stop-color="#0d1a2b"/>
      <stop offset="1" stop-color="#0a1a17"/>
    </linearGradient>
    <linearGradient id="name" x1="98" y1="112" x2="430" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cfe8ff"/>
      <stop offset="0.4" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="110" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(150 20) rotate(35) scale(360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f6feb" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(1030 300) rotate(-45) scale(300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2ea043" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" stroke="#1f6feb" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      @keyframes pulse { 0%,100% { opacity:.35; r:3.5 } 50% { opacity:1; r:5.5 } }
      @keyframes dash { to { stroke-dashoffset:-260 } }
      @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      @keyframes blink { 0%,45% { opacity:1 } 50%,100% { opacity:0 } }
      .n { animation: pulse 3.4s ease-in-out infinite; }
      .n2 { animation: pulse 4.2s ease-in-out .6s infinite; }
      .n3 { animation: pulse 3.8s ease-in-out 1.1s infinite; }
      .link { stroke-dasharray: 6 10; animation: dash 9s linear infinite; }
      .link2 { stroke-dasharray: 4 12; animation: dash 14s linear infinite reverse; }
      .halo { animation: floaty 7s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      text { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1180" height="320" rx="26" fill="url(#bg)"/>
  <rect width="1180" height="320" rx="26" fill="url(#grid)"/>
  <rect width="1180" height="320" rx="26" fill="url(#glow1)"/>
  <rect width="1180" height="320" rx="26" fill="url(#glow2)"/>

  <!-- data flow -->
  <g opacity="0.55">
    <path class="link" d="M520 150 H800" stroke="#58a6ff" stroke-opacity="0.30" stroke-width="1.2" fill="none"/>
    <circle class="n2" cx="800" cy="150" r="3.5" fill="#7ee787"/>
  </g>

  <!-- network topology -->
  <g class="halo" opacity="0.95" transform="matrix(1.16,0,0,1.16,-152,-28)">
    <g stroke="#58a6ff" stroke-opacity="0.45" stroke-width="1.4" fill="none">
      <path class="link"  d="M905 96 L1002 62 L1082 132 L962 186 L1042 244 L878 236 L842 152 Z"/>
      <path class="link2" d="M842 152 L905 96 M962 186 L1002 62 M878 236 L1082 132"/>
      <path class="link"  d="M1082 132 L1108 196 L1042 244"/>
    </g>
    <g fill="#7ee787">
      <circle class="n"  cx="905" cy="96"  r="4.5"/>
      <circle class="n2" cx="1002" cy="62" r="4"/>
      <circle class="n3" cx="1082" cy="132" r="5"/>
      <circle class="n"  cx="962" cy="186" r="4"/>
      <circle class="n2" cx="1042" cy="244" r="4.5"/>
      <circle class="n3" cx="878" cy="236" r="4"/>
      <circle class="n"  cx="842" cy="152" r="5"/>
      <circle class="n2" cx="1108" cy="196" r="3.5"/>
    </g>
    <g fill="#58a6ff" opacity="0.25" filter="url(#soft)">
      <circle cx="905" cy="96" r="14"/>
      <circle cx="1082" cy="132" r="16"/>
      <circle cx="842" cy="152" r="14"/>
    </g>
  </g>

  <!-- accent bar -->
  <rect x="72" y="96" width="5" height="112" rx="2.5" fill="url(#bar)"/>

  <!-- name -->
  <text x="98" y="158" font-size="74" font-weight="800" fill="url(#name)" letter-spacing="1">RASYA</text>

  <!-- role -->
  <text x="100" y="196" class="mono" font-size="15" letter-spacing="4.2" fill="#8b949e">NETWORK · WEB · LINUX HOMELAB</text>

  <!-- tagline -->
  <text x="100" y="238" class="mono" font-size="14" fill="#6e7681">$ belajar terus, bikin terus</text>
  <rect class="cursor" x="286" y="226" width="8" height="15" fill="#7ee787"/>

  <!-- footer meta -->
  <text x="100" y="278" font-size="13" fill="#484f58">github.com/rassyy · rasyagame06@gmail.com</text>
</svg>
